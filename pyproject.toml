[project]
name = "tibia-mirror"
version = "1.0.0"
description = "Mirror regions of the Tibia client into always-on-top windows (Windows, DWM thumbnails)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["mypy", "pyinstaller", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "ANN"]
# Intentional UI glyph: multiplication sign in region sizes such as "159×114".
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Test functions stay unannotated: pytest fills their arguments in.
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
files = ["main.py", "tibia_mirror"]
